<!DOCTYPE html>

<div class="info">
    Geo‑Matrix · 81‑Anime‑Slots · Wasser‑Shader · Drift‑Pulse · Partikel‑Flow
</div>

<!-- CANVAS -->
<canvas id="atmoCanvas" width="450" height="450"></canvas>

<!-- AtmoBoard laden -->

<script>
    // Canvas holen
    const atmoCanvas = document.getElementById('atmoCanvas');
