  line-height: 1rem;
}

.font-black{
  font-weight: 900;
}

.font-bold{
  font-weight: 700;
}

.leading-5{
  line-height: 1.25rem;
}

.leading-6{
  line-height: 1.5rem;
}

.leading-\[\.95\]{
  line-height: .95;
}

.leading-none{
  line-height: 1;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-\[\.18em\]{
  letter-spacing: .18em;
}

.tracking-\[\.24em\]{
  letter-spacing: .24em;
}

.tracking-\[\.2em\]{
  letter-spacing: .2em;
}

.tracking-widest{
  letter-spacing: 0.1em;
}

.text-\[\#38e8ff\]{
  --tw-text-opacity: 1;
  color: rgb(56 232 255 / var(--tw-text-opacity, 1));
}

.text-\[\#5effa8\]{
  --tw-text-opacity: 1;
  color: rgb(94 255 168 / var(--tw-text-opacity, 1));
}

.text-\[\#ff4fd8\]{
  --tw-text-opacity: 1;
  color: rgb(255 79 216 / var(--tw-text-opacity, 1));
}

.text-\[\#ffd166\]{
  --tw-text-opacity: 1;
  color: rgb(255 209 102 / var(--tw-text-opacity, 1));
}

.text-\[var\(--cyan\)\]{
  color: var(--cyan);
}

.text-\[var\(--gold\)\]{
  color: var(--gold);
}

.text-\[var\(--green\)\]{
  color: var(--green);
}

.text-\[var\(--magenta\)\]{
  color: var(--magenta);
}

.text-\[var\(--muted\)\]{
  color: var(--muted);
}

.text-\[var\(--text\)\]{
  color: var(--text);
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.shadow-\[0_0_30px_rgba\(255\2c 255\2c 255\2c \.08\)\]{
  --tw-shadow: 0 0 30px rgba(255,255,255,.08);
  --tw-shadow-colored: 0 0 30px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#070710;
  --surface:#0e0e1c;
  --surface-2:#141426;
  --line:#2a2a48;
  --text:#f2f0ff;
  --muted:#a9a7c8;
  --gold:#ffd166;
  --cyan:#38e8ff;
  --magenta:#ff4fd8;
  --green:#5effa8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#070710;
    --surface:#0e0e1c;
    --surface-2:#141426;
    --line:#2a2a48;
    --text:#f2f0ff;
    --muted:#a9a7c8;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace
}

.font-display{
  font-family:'Unbounded','JetBrains Mono',sans-serif
}

.triangle-glow{
  filter:drop-shadow(0 0 18px rgba(56,232,255,.28)) drop-shadow(0 0 28px rgba(255,79,216,.14))
}

input[type=range]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  width:100%;
  height:10px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--c) var(--p,50%),#292947 var(--p,50%));
  outline:none
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--c);
  box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 18px var(--c);
  cursor:pointer
}

input[type=range]::-moz-range-thumb{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--c);
  box-shadow:0 0 18px var(--c);
  cursor:pointer
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:bg-white:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white\/5:hover{
  background-color: rgb(255 255 255 / 0.05);
}

.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:-mx-6{
    margin-left: -1.5rem;
    margin-right: -1.5rem;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:grid{
    display: grid;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-3{
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\]{
    grid-template-columns: 1.35fr .65fr;
  }
}
